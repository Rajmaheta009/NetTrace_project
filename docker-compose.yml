version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nettrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nettrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nettrace"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nettrace-network

  backend:
    build:
      context: ./V2
      dockerfile: Dockerfile
    container_name: nettrace-backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_demo.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/nettrace
      - JWT_SECRET=supersecretjwtkeyforinvestigationsystemnettrace2026
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:3000","http://localhost:5173"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nettrace-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nettrace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - nettrace-network

volumes:
  pgdata:
    driver: local

networks:
  nettrace-network:
    driver: bridge
